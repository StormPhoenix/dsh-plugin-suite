# The suite mounts its dependencies explicitly; dependency bundles are not selected here.
- insert:
    - id: dsh-pet
      name: dsh-pet
    - id: memory
      name: dsh-memory
      config:
        path: !!js dshHomePath('memory/memory.db')
        promptRecentCount: 10
        promptMaxChars: 2000
        maxTextChars: 2000
        searchLimitDefault: 10
        searchLimitMax: 50
        promptOrder: 50
